name: Publish PRISM to PyPI

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Reviewed immutable release tag (for example v0.6.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prism-pypi-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.release_ref }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install build and verification tools
        run: python -m pip install build twine './lh2-tno[test]'
      - name: Match version to the reviewed tag
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: python -c "import os,tomllib; p=tomllib.load(open('lh2-tno/pyproject.toml','rb')); assert os.environ['RELEASE_REF']=='v'+p['project']['version']"
      - name: Verify portable contracts and conservation
        working-directory: lh2-tno
        run: python -m pytest -q
      - name: Build source and wheel distributions
        run: python -m build ./lh2-tno --outdir dist
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: prism-distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/prism-risk/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: prism-distributions
          path: dist
      - name: Publish through the project-scoped trusted publisher
        uses: pypa/gh-action-pypi-publish@v1.14.2
