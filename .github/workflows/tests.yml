name: Python contracts and numerical checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e './lh2-tno[test]' setuptools wheel
      - name: Run portable tests
        working-directory: lh2-tno
        run: python -m pytest -q
      - name: Verify frequency catalogue is shipped in the wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation ./lh2-tno -w wheelhouse
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('wheelhouse/lh2_tno-*.whl')[0]); assert 'lh2_tno/data/frequency_catalogue.json' in z.namelist()"
