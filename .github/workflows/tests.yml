name: Python contracts and numerical checks

on:
  push:
  pull_request:

permissions:
  contents: read

# A rapid series of commits should leave one current validation per ref.
# Older in-progress checks are superseded by the newest commit.
concurrency:
  group: prism-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Install package and test dependencies
        run: python -m pip install -e './lh2-tno[test]' setuptools wheel
      - name: Run portable tests
        working-directory: lh2-tno
        run: python -m pytest -q
      - name: Verify frequency catalogue is shipped in the wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation ./lh2-tno -w wheelhouse
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('wheelhouse/prism_risk-*.whl')[0]); assert 'lh2_tno/data/frequency_catalogue.json' in z.namelist(); assert 'tno_host.py' in z.namelist(); ep=z.read(next(n for n in z.namelist() if n.endswith('.dist-info/entry_points.txt'))).decode(); assert 'prism = tno_host:main' in ep"
