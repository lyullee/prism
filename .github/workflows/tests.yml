name: Python contracts and numerical checks

on:
  workflow_dispatch:
  # Validate the published branch on direct pushes. Development branches are
  # validated when opened or updated as pull requests, avoiding duplicate
  # runs when the release branch and a working branch are both pushed.
  push:
    branches:
      - main
    # Evidence ledgers and documentation are committed frequently while the
    # executable contract is unchanged.  Do not create an email-producing CI
    # run for those bookkeeping-only updates.
    paths-ignore:
      - 'lh2-tno/results/**'
      - 'lh2-tno/docs/**'
      - 'lh2-tno/CURRENT_STATUS.json'
      - 'lh2-tno/DEVELOPMENT_GOAL.json'
      - 'lh2-tno/README.md'
      - 'lh2-tno/README_ko.md'
      - 'lh2-tno/CITATION.cff'
      - 'lh2-tno/LICENSE'
      - 'lh2-tno/.zenodo.json'
      # Keep the filters robust if the package is checked out as the
      # repository root rather than under the lh2-tno/ subdirectory.
      - 'results/**'
      - 'docs/**'
      - 'CURRENT_STATUS.json'
      - 'DEVELOPMENT_GOAL.json'
      - 'README.md'
      - 'README_ko.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.zenodo.json'
  pull_request:
    branches:
      - main
    paths-ignore:
      - 'lh2-tno/results/**'
      - 'lh2-tno/docs/**'
      - 'lh2-tno/CURRENT_STATUS.json'
      - 'lh2-tno/DEVELOPMENT_GOAL.json'
      - 'lh2-tno/README.md'
      - 'lh2-tno/README_ko.md'
      - 'lh2-tno/CITATION.cff'
      - 'lh2-tno/LICENSE'
      - 'lh2-tno/.zenodo.json'
      - 'results/**'
      - 'docs/**'
      - 'CURRENT_STATUS.json'
      - 'DEVELOPMENT_GOAL.json'
      - 'README.md'
      - 'README_ko.md'
      - 'CITATION.cff'
      - 'LICENSE'
      - '.zenodo.json'

permissions:
  contents: read

# A rapid series of commits should leave one current validation per ref.
# Older in-progress checks are superseded by the newest commit.
concurrency:
  group: prism-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # Pin the runner image so CI does not change underneath the numerical test suite.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install package and public runtime dependencies
        run: python -m pip install -e './lh2-tno[full,test,xlsx]' setuptools wheel
      - name: Run portable tests
        working-directory: lh2-tno
        run: python -m pytest -q
      - name: Verify frequency catalogue is shipped in the wheel
        run: |
          python -m pip wheel --no-deps --no-build-isolation ./lh2-tno -w wheelhouse
          python -c "import glob,zipfile; z=zipfile.ZipFile(glob.glob('wheelhouse/prism_risk-*.whl')[0]); assert 'lh2_tno/data/frequency_catalogue.json' in z.namelist(); assert 'prism_qra/qra.py' in z.namelist(); assert 'prism_cli.py' in z.namelist(); ep=z.read(next(n for n in z.namelist() if n.endswith('.dist-info/entry_points.txt'))).decode(); assert 'prism = prism_cli:main' in ep"
