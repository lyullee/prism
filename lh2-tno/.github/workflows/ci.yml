name: PRISM CI

on:
  push:
    branches: [main]
    # Evidence ledgers and documentation are committed frequently while the
    # executable contract is unchanged.  Do not create an email-producing CI
    # run for those bookkeeping-only updates.
    # The repository root is the package root.  Keep evidence/status commits
    # out of the test workflow; the previous `lh2-tno/...` prefixes never
    # matched and caused a new run (and notification) for every ledger update.
    paths-ignore:
      - 'results/**'
      - 'docs/**'
      - 'CURRENT_STATUS.json'
      - 'DEVELOPMENT_GOAL.json'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'results/**'
      - 'docs/**'
      - 'CURRENT_STATUS.json'
      - 'DEVELOPMENT_GOAL.json'

permissions:
  contents: read

concurrency:
  group: prism-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python 3.12 tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install package and public runtime dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[full]"
      - name: Verify dependency metadata
        run: python -m pip check
      - name: Run test suite
        run: python -m pytest -q
