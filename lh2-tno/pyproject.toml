[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-risk"
version = "0.6.2"
description = "PRISM: Process Risk Integration and Scenario Modeling with optional LH2 analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Ugwiyeon Lee"}]
keywords = ["liquid hydrogen", "risk assessment", "digital twin", "consequence analysis", "cryogenic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.urls]
Repository = "https://github.com/lyullee/prism"
Documentation = "https://github.com/lyullee/prism/blob/main/README.md"
Issues = "https://github.com/lyullee/prism/issues"
Archive = "https://doi.org/10.5281/zenodo.23241358"

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26,<3", "CoolProp>=6.6,<9", "pypdf>=5,<7"]

[project.scripts]
prism = "tno_host:main"
lh2-tno = "lh2_tno.cli:main"
tno = "tno_host:main"

[tool.setuptools]
py-modules = ["tno_host"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lh2_tno = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
