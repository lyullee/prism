[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-risk"
version = "0.6.0"
description = "PRISM: Process Risk Integration and Scenario Modeling with optional LH2 analysis"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8", "numpy>=1.26,<3"]

[project.scripts]
prism = "tno_host:main"
lh2-tno = "lh2_tno.cli:main"
tno = "tno_host:main"

[tool.setuptools]
py-modules = ["tno_host"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lh2_tno = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
