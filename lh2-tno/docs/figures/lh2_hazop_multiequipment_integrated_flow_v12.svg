<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1350" viewBox="0 0 2400 1350">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#12324a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 Z" fill="#2499b4"/>
    </marker>
    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L14,7 L0,14 Z" fill="#e78b3c"/>
    </marker>
    <style>
      .font { font-family: 'Malgun Gothic','Noto Sans KR','Arial',sans-serif; fill:#112f46; }
      .title { font-size:48px; font-weight:700; fill:#ffffff; }
      .subtitle { font-size:25px; font-weight:400; fill:#b9d2e1; }
      .section { font-size:30px; font-weight:700; fill:#247699; }
      .boxTitle { font-size:25px; font-weight:700; fill:#17506d; }
      .boxText { font-size:27px; font-weight:600; fill:#12324a; }
      .small { font-size:21px; font-weight:500; fill:#476a80; }
      .tiny { font-size:19px; font-weight:500; fill:#5e7d90; }
      .whiteTitle { font-size:28px; font-weight:700; fill:#ffffff; }
      .whiteText { font-size:21px; font-weight:500; fill:#d7e8f0; }
      .rowTitle { font-size:24px; font-weight:700; }
      .pill { font-size:20px; font-weight:700; }
    </style>
  </defs>

  <!-- Header -->
  <rect width="2400" height="185" fill="#08253a"/>
  <rect x="80" y="54" width="10" height="74" rx="5" fill="#39c4d6"/>
  <text x="120" y="92" class="font title">액화수소 인수기지 통합 위험분석 흐름</text>
  <text x="120" y="137" class="font subtitle">현장 입력값 + 운전 모드 → HAZOP 이탈 판단 → 통합 정량 위험평가 → 관리자 대응</text>
  <text x="2180" y="94" class="font subtitle" text-anchor="end">실시간 + 예측</text>
  <text x="2180" y="132" class="font subtitle" text-anchor="end">모델 통합 구조</text>

  <!-- Background -->
  <rect y="185" width="2400" height="1165" fill="#f5f9fc"/>

  <!-- Section 1 -->
  <text x="90" y="230" class="font section">01  입력과 시나리오 결정</text>

  <!-- Top boxes -->
  <g filter="url(#shadow)">
    <rect x="90" y="260" width="460" height="180" rx="24" fill="#ffffff" stroke="#39bccc" stroke-width="3"/>
    <rect x="610" y="260" width="460" height="180" rx="24" fill="#ffffff" stroke="#a9c6d9" stroke-width="3"/>
    <rect x="1130" y="260" width="460" height="180" rx="24" fill="#ffffff" stroke="#a9c6d9" stroke-width="3"/>
    <rect x="1650" y="260" width="650" height="180" rx="24" fill="#e4f6f8" stroke="#39bccc" stroke-width="3"/>
  </g>
  <rect x="120" y="285" width="155" height="38" rx="19" fill="#d8f5f6"/>
  <text x="197" y="312" class="font pill" text-anchor="middle" fill="#14778c">현장 입력</text>
  <text x="120" y="355" class="font boxText">인수기지 실시간 모니터링</text>
  <text x="120" y="390" class="font small">압력 · 온도 · 유량 · 밸브 상태</text>
  <text x="120" y="420" class="font small" fill="#14778c">+ 운전 모드: 인수 · 공급 · 대기</text>

  <rect x="640" y="285" width="180" height="38" rx="19" fill="#e5eef5"/>
  <text x="730" y="312" class="font pill" text-anchor="middle" fill="#2c6687">HAZOP 테이블</text>
  <text x="640" y="355" class="font boxText">관측값 + 운전 모드별</text>
  <text x="640" y="390" class="font boxText">이탈 기준 비교</text>
  <text x="640" y="420" class="font small">정성적 위험 판단 · 원인/결과 연결</text>

  <rect x="1160" y="285" width="125" height="38" rx="19" fill="#e5eef5"/>
  <text x="1222" y="312" class="font pill" text-anchor="middle" fill="#2c6687">판단</text>
  <text x="1160" y="355" class="font boxText">현재 운전 모드와</text>
  <text x="1160" y="390" class="font boxText">이탈 유형을 함께 해석</text>
  <text x="1160" y="420" class="font small">인수 · 공급 · 대기 · 정비</text>

  <rect x="1680" y="285" width="155" height="38" rx="19" fill="#c9f0f2"/>
  <text x="1757" y="312" class="font pill" text-anchor="middle" fill="#14778c">시나리오 선택</text>
  <text x="1680" y="355" class="font boxText">이탈 종류 × 운전 모드</text>
  <text x="1680" y="390" class="font boxText">대상 설비 · 방출 경로 · 사고 조건 확정</text>
  <text x="1680" y="420" class="font small">선택된 시나리오를 아래 평가 계층에 전달</text>

  <!-- Top arrows -->
  <path d="M550 350 H600" fill="none" stroke="#2499b4" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M1070 350 H1120" fill="none" stroke="#2499b4" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M1590 350 H1640" fill="none" stroke="#2499b4" stroke-width="5" marker-end="url(#arrowBlue)"/>

  <!-- Integration band -->
  <rect x="90" y="480" width="2210" height="55" rx="18" fill="#e8f2f7"/>
  <text x="120" y="516" class="font boxTitle">02  선택된 위험 시나리오를 동일한 정량평가 계층에 전달</text>
  <text x="2260" y="516" class="font small" text-anchor="end">현재 상태와 예측 상태가 같은 모델 묶음을 사용</text>

  <!-- Shared model layer -->
  <g filter="url(#shadow)">
    <rect x="875" y="560" width="760" height="610" rx="28" fill="#ffffff" stroke="#6c9db7" stroke-width="3"/>
  </g>
  <rect x="875" y="560" width="760" height="78" rx="28" fill="#ddecf3"/>
  <text x="925" y="607" class="font" font-size="29" font-weight="700" fill="#174f6b">통합 정량 위험평가 계층</text>
  <text x="925" y="630" class="font tiny">각 모델의 계산 결과를 조합하여 조건부 위험도를 산출</text>

  <!-- Model modules -->
  <g>
    <rect x="925" y="675" width="310" height="115" rx="18" fill="#f2f7fb" stroke="#a9c6d9" stroke-width="2"/>
    <text x="955" y="710" class="font boxTitle">사고 빈도 모델</text>
    <text x="955" y="745" class="font small">문헌·설비별 근거</text>
    <text x="955" y="773" class="font small">운전 상태별 조건부 빈도</text>

    <rect x="1275" y="675" width="310" height="115" rx="18" fill="#f2f7fb" stroke="#a9c6d9" stroke-width="2"/>
    <text x="1305" y="710" class="font boxTitle">방출·차단·재고 모델</text>
    <text x="1305" y="745" class="font small">누출량 · 지속시간</text>
    <text x="1305" y="773" class="font small">격리 지연 · 재고 소진</text>

    <rect x="925" y="820" width="310" height="115" rx="18" fill="#edf9fa" stroke="#65c8d2" stroke-width="2"/>
    <text x="955" y="855" class="font boxTitle">SLABx‑LH2</text>
    <text x="955" y="890" class="font small">액화수소 누출·확산</text>
    <text x="955" y="918" class="font small">농도·가연범위·시간 변화</text>

    <rect x="1275" y="820" width="310" height="115" rx="18" fill="#f2f7fb" stroke="#a9c6d9" stroke-width="2"/>
    <text x="1305" y="855" class="font boxTitle">점화·영향·시설 모델</text>
    <text x="1305" y="890" class="font small">점화·기상·차단 조건</text>
    <text x="1305" y="918" class="font small">인구 · IR/F‑N · 시설 영향</text>
  </g>

  <!-- PRISM as integrated orchestration -->
  <rect x="925" y="980" width="660" height="125" rx="18" fill="#edf3f7" stroke="#8aaec1" stroke-width="2"/>
  <text x="955" y="1018" class="font boxTitle">계산 통합·추적: PRISM</text>
  <text x="955" y="1052" class="font small">모델 입력·출력 연결 · 조건부 위험도 계산</text>
  <text x="955" y="1082" class="font small">현재·예측 비교 · 근거·불확실성 기록</text>
  <text x="1555" y="1018" class="font tiny" text-anchor="end">통합 계층의 한 구성요소</text>
  <text x="1555" y="1052" class="font tiny" text-anchor="end">모델을 대체하지 않음</text>

  <!-- Current row -->
  <rect x="90" y="560" width="735" height="270" rx="24" fill="#ffffff" stroke="#40bdca" stroke-width="3"/>
  <rect x="115" y="585" width="215" height="38" rx="19" fill="#d8f5f6"/>
  <text x="222" y="612" class="font rowTitle" text-anchor="middle" fill="#14778c">A  현재 상태 · 준실시간</text>
  <text x="130" y="672" class="font boxText">모니터링 상태값</text>
  <text x="130" y="710" class="font small">현재 압력 · 온도 · 유량 · 재고</text>
  <text x="130" y="743" class="font small">+ 운전 모드 + 확정 시나리오</text>
  <path d="M130 770 H785" fill="none" stroke="#40bdca" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="130" y="805" class="font tiny">즉시 분석 요청 → 통합 정량평가 계층</text>

  <!-- Forecast row -->
  <rect x="90" y="865" width="735" height="305" rx="24" fill="#ffffff" stroke="#e7a154" stroke-width="3"/>
  <rect x="115" y="890" width="255" height="38" rx="19" fill="#fff0de"/>
  <text x="242" y="917" class="font rowTitle" text-anchor="middle" fill="#a9652a">B  예측 상태 · 시뮬레이션</text>
  <text x="130" y="978" class="font boxText">공정 시뮬레이션</text>
  <text x="130" y="1016" class="font small">시간에 따른 압력·온도·재고 변화 예측</text>
  <text x="130" y="1050" class="font small">위험조건 도달 시 분석 요청</text>
  <path d="M130 1077 H785" fill="none" stroke="#e7a154" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="130" y="1115" class="font tiny">예측 시점별 상태 → 같은 통합 계층을 반복 호출</text>
  <text x="130" y="1147" class="font tiny" fill="#a9652a">위험조건 미도달 시 시뮬레이션 계속</text>

  <!-- arrows into model layer -->
  <path d="M825 700 H865" fill="none" stroke="#40bdca" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M825 1020 H865" fill="none" stroke="#e78b3c" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <text x="845" y="681" class="font tiny" text-anchor="middle" fill="#14778c">현재</text>
  <text x="845" y="1001" class="font tiny" text-anchor="middle" fill="#a9652a">예측</text>

  <!-- outputs -->
  <g filter="url(#shadow)">
    <rect x="1710" y="560" width="590" height="270" rx="24" fill="#e4f4ec" stroke="#66b994" stroke-width="3"/>
    <rect x="1710" y="865" width="590" height="305" rx="24" fill="#fff1e3" stroke="#e7a154" stroke-width="3"/>
  </g>
  <rect x="1740" y="585" width="165" height="38" rx="19" fill="#d5f0e3"/>
  <text x="1822" y="612" class="font rowTitle" text-anchor="middle" fill="#2d7959">현재 위험 결과</text>
  <text x="1740" y="672" class="font boxText">조건부 위험도 · 영향범위</text>
  <text x="1740" y="710" class="font small">비상대응·안전관리 시나리오 생성</text>
  <text x="1740" y="745" class="font small">관리자 화면에 경보·대응안 표시</text>
  <text x="1740" y="795" class="font tiny">목표: 센서 갱신 주기에 맞춘 준실시간 평가</text>

  <rect x="1740" y="890" width="165" height="38" rx="19" fill="#ffe2be"/>
  <text x="1822" y="917" class="font rowTitle" text-anchor="middle" fill="#a9652a">예측 위험 결과</text>
  <text x="1740" y="977" class="font boxText">미래 시점 위험도·영향 예측</text>
  <text x="1740" y="1015" class="font small">선제 안전조치·운전계획 지원</text>
  <text x="1740" y="1050" class="font small">위험조건 도달 시 재평가</text>
  <text x="1740" y="1112" class="font tiny">시뮬레이션 시간축을 따라 반복 실행</text>
  <text x="1740" y="1145" class="font tiny">결과는 현재 결과와 같은 형식으로 제공</text>

  <!-- arrows model to outputs -->
  <path d="M1645 700 H1700" fill="none" stroke="#40bdca" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <path d="M1645 1020 H1700" fill="none" stroke="#e78b3c" stroke-width="5" marker-end="url(#arrowOrange)"/>

  <!-- top scenario down connector -->
  <path d="M1975 440 V515" fill="none" stroke="#2499b4" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text x="2010" y="490" class="font tiny">확정 시나리오</text>

  <!-- footer -->
  <rect x="90" y="1210" width="2210" height="90" rx="18" fill="#e8f2f7"/>
  <text x="120" y="1246" class="font boxTitle">해석 기준</text>
  <text x="315" y="1246" class="font small">운전 모드가 포함된 현장 입력값을 HAZOP 기준과 비교하여 시나리오를 선택하고,</text>
  <text x="315" y="1278" class="font small">현재 경로는 즉시 평가, 예측 경로는 위험조건 도달 시 동일한 통합 모델 계층을 반복 실행합니다.</text>
</svg>